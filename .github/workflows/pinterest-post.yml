name: Pinterest Queue Poster

# Posts any "pending" entries in pinterest-queue/queue.json to Pinterest.
# Runs on GitHub's runners because the Claude Cowork sandbox blocks
# pin_post.py's direct Pinterest API calls ("External System Writes").
#
# mcf-operator stages pins by committing new "pending" entries (plus the
# referenced image under pinterest-queue/assets/) to pinterest-queue/queue.json
# and pushing to main. That push triggers this workflow. The schedule is a
# safety net in case a push-triggered run is missed.

on:
  push:
    branches: [main]
    paths:
      - "pinterest-queue/queue.json"
  schedule:
    - cron: "0 15 * * 1,3,5"   # Mon/Wed/Fri 15:00 UTC
  workflow_dispatch:

concurrency:
  group: pinterest-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post pending pins
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python scripts/pinterest-post-queue.py

      - name: Commit updated queue status
        if: always()
        run: |
          git config user.name "mcf-pinterest-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- pinterest-queue/queue.json; then
            git add pinterest-queue/queue.json
            git commit -m "Pinterest queue: record post results [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No change to queue.json; nothing to commit."
          fi
